services:
  aetherswap:
    build: .
    ports:
      - "28472:28472"
    volumes:
      - aether-config:/app/config
    environment:
      - AETHER_HOST=0.0.0.0
      - AETHER_PORT=28472
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:28472/api/status"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  aether-config:
